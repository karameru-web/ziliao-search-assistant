name: 打包 Windows 版

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: >
          pyinstaller --noconfirm --onefile --windowed --name 资料搜索助手
          --add-data "templates;templates"
          --add-data "static;static"
          windows_launcher.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 资料搜索助手-windows
          path: dist/资料搜索助手.exe
