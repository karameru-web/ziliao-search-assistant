<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在搜索 · 资料搜索助手</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/icons/bootstrap-icons.css" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

{% include "_nav.html" %}

<div class="hero py-4 mb-4">
  <div class="container text-center">
    <h1 class="h3 mb-1"><span class="hero-emoji">📚</span> 资料搜索助手 <span class="hero-emoji">🌸</span></h1>
    <p class="sub mb-3">B站 + Bing + 知乎 · 把全网的重复和相似内容整理成资料组</p>
    <form method="post" action="/" class="search-wrap row g-2">
      <div class="col-12 col-md-9">
        <input class="form-control form-control-lg" type="text" name="keyword"
               value="{{ keyword }}" placeholder="例如：考研英语 真题">
      </div>
      <div class="col-12 col-md-3 d-grid">
        <button class="btn btn-warning btn-lg fw-semibold" type="submit">
          <i class="bi bi-arrow-repeat me-1"></i>重新搜索
        </button>
      </div>
    </form>
  </div>
</div>

<div class="container" style="max-width: 680px;">
  <div class="card border-0 shadow-sm rounded-4 p-4">
    {% if not_found %}
    <div class="alert alert-danger mb-0">
      <strong>任务不存在或已过期。</strong>
      <a class="btn btn-sm btn-danger ms-2" href="/">返回重新搜索</a>
    </div>
    {% else %}
    <h5 class="mb-3">正在全网搜索并整理中…</h5>
    <div class="progress" role="progressbar" aria-label="搜索进度" style="height: 18px;">
      <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
           style="width: 4%"></div>
    </div>
    <p id="count-text" class="mt-3 mb-0 fw-semibold">已抓到 0 条内容</p>
    <p id="note-text" class="text-muted small mt-1">
      正在访问 B站、Bing 和知乎，通常需要 1 分钟左右，请勿关闭本页面。
    </p>
    <div id="timeout-box" class="d-none alert alert-danger mt-3 mb-0">
      <strong>搜索超时，请重试。</strong>可能是网络较慢或对方网站限制了访问。
      <a class="btn btn-sm btn-danger ms-2" href="/">重新搜索</a>
    </div>
    <div id="error-box" class="d-none alert alert-warning mt-3 mb-0">
      <strong>搜索出错，请重试。</strong><span id="error-text"></span>
      <a class="btn btn-sm btn-warning ms-2" href="/">重新搜索</a>
    </div>
    {% endif %}
  </div>
</div>

<div class="cute-footer">🌸 本地运行 · 请耐心等待搜索完成</div>

<script>
{% if not not_found %}
const SEARCH_ID = "{{ search_id }}";
const bar = document.getElementById('progress-bar');
const countText = document.getElementById('count-text');
const noteText = document.getElementById('note-text');
const timeoutBox = document.getElementById('timeout-box');
const errorBox = document.getElementById('error-box');
const errorText = document.getElementById('error-text');
let polling = true;

function widthOf(count) {
  // 目标约 130 条；进度条宽度随真实抓取数增长，最多显示到 95%
  return Math.min(95, Math.max(4, Math.round(count / 130 * 100)));
}

async function poll() {
  if (!polling) return;
  try {
    const resp = await fetch('/search_status/' + SEARCH_ID);
    const s = await resp.json();
    if (resp.status === 404) {
      polling = false;
      errorText.textContent = s.error || '';
      errorBox.classList.remove('d-none');
      bar.classList.remove('progress-bar-animated');
      return;
    }
    bar.style.width = widthOf(s.count) + '%';
    countText.textContent = '已抓到 ' + s.count + ' 条内容';
    if (s.timed_out) {
      polling = false;
      timeoutBox.classList.remove('d-none');
      noteText.classList.add('d-none');
      bar.classList.remove('progress-bar-animated');
      return;
    }
    if (s.status === 'error') {
      polling = false;
      errorText.textContent = s.error || '';
      errorBox.classList.remove('d-none');
      bar.classList.remove('progress-bar-animated');
      return;
    }
    if (s.done) {
      polling = false;
      window.location.href = '/result/' + SEARCH_ID;
    }
  } catch (e) {
    // 网络小抖动，等下一轮轮询再试
  }
}

poll();
setInterval(poll, 2500);
{% endif %}
</script>

</body>
</html>
